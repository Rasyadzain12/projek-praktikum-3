<body>
    <h1 align='center'>black Gouse biztro | Pizza-one-stop</h1>
    <p>our 12quet; wood-firedpizza, pasta are avablible for delivery and dine in</p>

    <form action="hasil.html" method="get">
        <fieldset>
            <legend>your infornation</legend>
                <p>
                    <label for="name">Name: </label>
                    <input type="text" id="name" name="customername">
                </p>

            <p>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address">
            </p>

            <p>
                <label for="telephone">Phone:</label>
                <input type="text" id="telephone" name="telephone">
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
            </p>

            <p>
                <label for="instructions">delivery instructions</label>
                <br>
                <textarea id="instructions" name="instructions" cols="50" rows="4" maxlength="400"
                    placeholder="No more than 400 characters"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>design your dream pizza</legend>
            <p>pizza spec</p>
            <p>pilih 1:</p>

            <p>
                <input type="radio" id="classic" name="Crust" value="Classic White">
                <label for="classic">Classic White</label><br>

                <input type="radio" id="multigrain" name="Crust" value="multigrain">
                <label for="multigrain">multigrain</label><br>

                <input type="radio" id="chease" name="Crust" value="chease">
                <label for="chease">chease</label><br>

                <input type="radio" id="gluten" name="Crust" value="gluten">
                <label for="gluten">gluten</label><br>
            </p>

            <p>Topping</p>

            <p>
                <input type="checkbox" id="pepperoni" name="toppings" value="pepperoni">
                <label for="pepperoni">Pepperoni</label><br>

                <input type="checkbox" id="mushroom" name="toppings" value="mushroom">
                <label for="mushroom">Mushroom</label><br>

                <input type="checkbox" id="onion" name="toppings" value="onion">
                <label for="onion">Onion</label><br>

                <input type="checkbox" id="sausage" name="toppings" value="sausage">
                <label for="sausage">Sausage</label><br>

                <input type="checkbox" id="bacon" name="toppings" value="bacon">
                <label for="bacon">Bacon</label><br>

                <input type="checkbox" id="extraCheese" name="toppings" value="extra cheese">
                <label for="extraCheese">Extra Cheese</label><br>

                <input type="checkbox" id="greenPeppers" name="toppings" value="green peppers">
                <label for="greenPeppers">Green Peppers</label><br>
            </p>

            <p>
                <label for="quantity">Quantity: </label>
                <input type="number" id="quantity" name="quantity" min="1" max="10">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="place my order">
            <input type="reset" value="reset">
        </p>
    </form>

</body>

</html>
